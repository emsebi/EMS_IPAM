415d" filter="url(#sh)"/><rect x="90" y="610" width="6" height="165" rx="3" fill="#5b83ff"/><text x="114" y="645" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#eef6ff" text-anchor="start">Policy logic</text><text x="120" y="665" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#cfe0ff" text-anchor="start">Known + Allow  → Keep switch VLAN</text><text x="120" y="705" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#cfe0ff" text-anchor="start">Known + VLAN   → Dynamic VLAN from RADIUS</text><text x="120" y="745" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#ff9aaa" text-anchor="start">Blocked/Disabled → Reject</text><rect x="790" y="610" width="690" height="165" rx="16" fill="#0d1b2e" stroke="#29415d" filter="url(#sh)"/><rect x="790" y="610" width="6" height="165" rx="3" fill="#26c281"/><text x="814" y="645" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#eef6ff" text-anchor="start">Baseline discovery</text><text x="820" y="665" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#cfe0ff" text-anchor="start">Discover endpoint MACs from switch snapshots</text><text x="820" y="705" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#cfe0ff" text-anchor="start">Skip uplink-only MACs and import after Admin confirmation</text><text x="820" y="745" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#91a4bd" text-anchor="start">Keep a small location history, not heavy logging</text></svg>