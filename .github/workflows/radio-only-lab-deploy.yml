name: EMS-IPAM Radio-Only Lab Deployment

on:
  push:
    branches:
      - work/radio-documentation-map-20261103
    paths:
      - .github/radio-deploy-trigger.txt

permissions:
  contents: read

concurrency:
  group: ems-ipam-lab-deploy
  cancel-in-progress: false

jobs:
  update-radio-only:
    runs-on: [self-hosted, Linux, X64, ems-ipam-lab]
    timeout-minutes: 18
    steps:
      - name: Checkout tested radio branch
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Back up and replace Radio module only; automatically roll back on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY="$HOME/ems-ipam-lab/current"
          ENV_FILE="$HOME/.ems-ipam-lab.env"
          BEFORE="$HOME/ems-ipam-lab/radio-backups/$GITHUB_SHA"
          test -f "$DEPLOY/compose.yml"
          test -s "$ENV_FILE"
          grep -qx 'EMS_HTTP_PORT=8888' "$ENV_FILE"
          test -d "$DEPLOY/modules/radio"
          test -f "$GITHUB_WORKSPACE/modules/radio/public/topology.mjs"
          test -f "$GITHUB_WORKSPACE/modules/radio/backend/index.mjs"
          test -f "$GITHUB_WORKSPACE/modules/radio/backend/geo.mjs"
          test -f "$GITHUB_WORKSPACE/modules/radio/public/map-frame.html"
          test -f "$GITHUB_WORKSPACE/modules/radio/public/map-frame.mjs"
          test -f "$DEPLOY/modules/radius-ops/compose.module.yml"
          docker info >/dev/null
          docker inspect ems-ipam-app-1 >/dev/null
          docker inspect ems-ipam-db-1 >/dev/null
          docker inspect ems-ipam-radius_ops-1 >/dev/null

          mkdir -p "$BEFORE"
          cp -a "$DEPLOY/modules/radio" "$BEFORE/radio"
          python3 "$DEPLOY/scripts/radius-upgrade-check.py" --snapshot "$BEFORE/radius-before.json"

          RADIUS_CONTAINER_BEFORE="$(docker inspect --format '{{.Id}}' ems-ipam-radius_ops-1)"
          DB_CONTAINER_BEFORE="$(docker inspect --format '{{.Id}}' ems-ipam-db-1)"
          COMPOSE=(docker compose --project-name ems-ipam --env-file "$ENV_FILE" -f "$DEPLOY/compose.yml" -f "$DEPLOY/modules/radius-ops/compose.module.yml")
          ROLLBACK=1
          rollback() {
            code=$?
            if [ "$ROLLBACK" -eq 1 ]; then
              echo "::warning::Radio-only update failed (exit $code): restoring prior Radio module."
              rm -rf "$DEPLOY/modules/radio"
              cp -a "$BEFORE/radio" "$DEPLOY/modules/radio"
              "${COMPOSE[@]}" restart app || true
            fi
          }
          trap rollback EXIT

          STAGED="$DEPLOY/modules/.radio-staged-$GITHUB_SHA"
          mkdir -p "$STAGED"
          cp -a "$GITHUB_WORKSPACE/modules/radio/." "$STAGED/"
          chmod -R u+rwX "$STAGED"
          rm -rf "$DEPLOY/modules/radio"
          mv "$STAGED" "$DEPLOY/modules/radio"

          "${COMPOSE[@]}" restart app
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8888/health > "$BEFORE/health-after.json"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q '"radio"' "$BEFORE/health-after.json"
          grep -q 'renderRadioTopology' "$DEPLOY/modules/radio/public/topology.mjs"
          grep -q '2.3.0-lab.1' "$DEPLOY/modules/radio/module.json"
          grep -q 'tile.openstreetmap.org' "$DEPLOY/modules/radio/public/map-frame.mjs"
          grep -q 'radio-link-distance' "$DEPLOY/modules/radio/public/map-frame.mjs"
          test -f "$DEPLOY/modules/radio/public/geo-math.mjs"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8888/api/radio/map)"
          test "$code" = "401" || { echo "::error::Radio map is not protected behind login (HTTP $code)."; exit 1; }
          # Module migration must run successfully and the app DB role must be able to write.
          # Probe under ROLLBACK so no real Radio or Inventory data is altered.
          docker exec ems-ipam-app-1 node --input-type=module -e '
            import pg from "pg";
            const pool=new pg.Pool();
            const client=await pool.connect();
            try {
              await client.query("BEGIN");
              const tables=await client.query("SELECT to_regclass(\u0027public.radio_doc_locations\u0027) AS locations,to_regclass(\u0027public.radio_doc_uplinks\u0027) AS uplinks");
              if(!tables.rows[0].locations||!tables.rows[0].uplinks)throw new Error("Radio module migration missing");
              const sample=(await client.query("SELECT id FROM hosts WHERE radio_mode=\u0027ap\u0027 AND deleted_at IS NULL LIMIT 1")).rows[0];
              if(sample){
                await client.query("INSERT INTO radio_doc_locations(host_id,latitude,longitude) VALUES($1,$2,$3) ON CONFLICT(host_id) DO UPDATE SET latitude=EXCLUDED.latitude,longitude=EXCLUDED.longitude",[sample.id,0,0]);
                await client.query("INSERT INTO radio_doc_uplinks(ap_id,destination_id,port) VALUES($1,$2,$3) ON CONFLICT(ap_id) DO UPDATE SET destination_id=EXCLUDED.destination_id,port=EXCLUDED.port",[sample.id,null,""]);
              }
              console.log("PASS Radio PostgreSQL storage and transaction (changes rolled back)");
            } finally {
              await client.query("ROLLBACK").catch(()=>{});
              client.release();await pool.end();
            }
          '
          python3 "$DEPLOY/scripts/installed-modules-check.py"
          python3 "$DEPLOY/scripts/radius-upgrade-check.py" --compare "$BEFORE/radius-before.json"
          test "$(docker inspect --format '{{.Id}}' ems-ipam-radius_ops-1)" = "$RADIUS_CONTAINER_BEFORE"
          test "$(docker inspect --format '{{.Id}}' ems-ipam-db-1)" = "$DB_CONTAINER_BEFORE"
          ROLLBACK=0
          echo "RADIO_ONLY_DEPLOY_OK branch=$GITHUB_REF_NAME commit=$GITHUB_SHA port=8888"
          echo "RADIUS and DB containers unchanged; old Radio backed up privately."
