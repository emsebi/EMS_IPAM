name: EMS-IPAM Radio Storage Permission Repair

on:
  push:
    branches:
      - work/radio-documentation-map-20261103
    paths:
      - .github/radio-storage-permission-trigger.txt

permissions:
  contents: read

concurrency:
  group: ems-ipam-lab-deploy
  cancel-in-progress: false

jobs:
  repair-radio-folder:
    runs-on: [self-hosted, Linux, X64, ems-ipam-lab]
    timeout-minutes: 8
    steps:
      - name: Verify active app and repair only the Radio documentation directory
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="ems-ipam-app-1"
          test "$(docker inspect --format '{{.State.Running}}' "$APP")" = "true"
          test "$(docker inspect --format '{{.State.Running}}' ems-ipam-db-1)" = "true"
          test "$(docker inspect --format '{{.State.Running}}' ems-ipam-radius_ops-1)" = "true"
          case "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.RW}}{{end}}{{end}}' "$APP")" in
            true) ;;
            *) echo "::error::App has no writable /backups bind mount. Aborting without changes."; exit 1 ;;
          esac
          APP_USER_ID="$(docker exec "$APP" id -u)"
          APP_GROUP_ID="$(docker exec "$APP" id -g)"
          case "$APP_USER_ID:$APP_GROUP_ID" in
            *[!0-9:]*|'') echo "::error::Unexpected app UID/GID"; exit 1;;
          esac
          docker exec --user root "$APP" sh -eu -c '
            dir=/backups/radio-documentation
            test -d /backups
            test ! -L /backups
            test ! -L "$dir"
            mkdir -p "$dir"
            chown "$1:$2" "$dir"
            chmod 0700 "$dir"
            for name in locations.json uplinks.json; do
              file="$dir/$name"
              test ! -L "$file"
              if [ -f "$file" ]; then
                chown "$1:$2" "$file"
                chmod 0600 "$file"
              fi
            done
          ' sh "$APP_USER_ID" "$APP_GROUP_ID"
          # Probe actual runtime credentials inside the active container.
          docker exec "$APP" node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import crypto from "node:crypto";
            const dir="/backups/radio-documentation";
            const target=path.join(dir,".radio-write-test-"+crypto.randomUUID());
            try {
              fs.writeFileSync(target,"ok",{mode:0o600,flag:"wx"});
              if(fs.readFileSync(target,"utf8")!=="ok")throw new Error("Radio write/read mismatch");
              console.log("PASS Radio save folder writable by actual app UID");
            } finally {
              try{fs.unlinkSync(target)}catch{}
            }
          '
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/health)" = "200"
          echo "PASS /health, RADIUS/DB containers untouched; saved Radio files preserved."
