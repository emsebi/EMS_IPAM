name: MikroTik Route Manager isolated REST connection check
on:
  push:
    branches: [ops/mrm-host-access-20261128]
    paths: [.github/workflows/mrm-router-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: mrm-isolated-lab
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'emsebi/EMS_IPAM'
    runs-on: [self-hosted, Linux, X64, ems-ipam-lab]
    timeout-minutes: 4
    steps:
      - name: Check configured RouterOS endpoint from Route Manager container
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i mikrotik-route-manager python - <<'PY'
          import sys, socket
          sys.path.insert(0, '/app')
          import app
          host,port = app.get_router_config()
          print('Configured RouterOS host:', host)
          print('Router host matches user PC 10.1.1.240:', host=='10.1.1.240')
          print('TLS certificate verification enabled:', app.setting('router_verify_tls','true'))
          print('Router username matches api:', app.setting('router_user')=='api')
          print('Configured RouterOS port:',port)
          print('API username configured:',bool(app.setting('router_user')))
          print('API password configured:',bool(app.setting('router_pass')))
          try:
              c=socket.create_connection((host,port),timeout=4)
              c.close()
              print('Configured REST TCP port',port,'OPEN')
          except OSError as e:
              print('Configured REST TCP port',port,'FAILED',type(e).__name__,getattr(e,'errno',None))
          import ssl
          try:
              with socket.create_connection((host,port),timeout=4) as raw:
                  with ssl._create_unverified_context().wrap_socket(raw,server_hostname=host) as tls:
                      print('HTTPS handshake SUCCESS; TLS:',tls.version())
          except Exception as e:
              print('HTTPS handshake FAILED:',type(e).__name__,str(e)[:180])
          try:
              result = app.router_request('GET','system/resource')
              print('RouterOS REST API:', 'SUCCESS' if isinstance(result,dict) else 'RESPONDED')
          except Exception as e:
              print('RouterOS REST API FAILED:', type(e).__name__,str(e)[:180])
          for endpoint in ('ppp/active','ip/hotspot/active','ip/firewall/address-list'):
              try:
                  rows=app.router_request('GET',endpoint)
                  print('REST GET /rest/'+endpoint+': OK; count='+str(len(rows) if isinstance(rows,list) else 'n/a'))
              except Exception as exc:
                  print('REST GET /rest/'+endpoint+': FAILED; '+type(exc).__name__+' '+str(exc)[:160])
          print('Diagnostic complete; RouterOS records were not modified.')
          for api_port in (8728,8729,22):
              try:
                  with socket.create_connection((host,api_port),timeout=2):
                      print('Alternative management TCP',api_port,'OPEN')
              except OSError as exc:
                  print('Alternative management TCP',api_port,'NOT AVAILABLE',type(exc).__name__)
          PY
