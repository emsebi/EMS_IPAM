name: EMS-IPAM CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docker-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
