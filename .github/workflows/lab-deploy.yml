name: EMS-IPAM Lab Deploy

on:
  push:
    branches:
      - "work/i18n-personnel-foundation"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ems-ipam-lab-deploy
  cancel-in-progress: true

jobs:
  deploy-lab:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/i18n-personnel-foundation'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ems-ipam-lab
    timeout-minutes: 35
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify dedicated Docker lab
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version
          test -f compose.yml
          test -f modules/radius-ops/compose.module.yml
          echo "Runner: $RUNNER_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Preserve installed lab configuration
        id: preserve
        shell: bash
        run: |
          set -Eeuo pipefail
          LAB_ROOT="$HOME/ems-ipam-lab"
          ENV_FILE="$HOME/.ems-ipam-lab.env"
          mkdir -p "$LAB_ROOT"

          if docker run --rm -v /var/lib/ems-ipam:/state:ro postgres:16-alpine             sh -c 'test -s /state/.env && cat /state/.env' > "$ENV_FILE.tmp"; then
            mv "$ENV_FILE.tmp" "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "Existing EMS-IPAM lab credentials/config preserved without printing secrets."
          else
            rm -f "$ENV_FILE.tmp"
            echo "::error::Existing /var/lib/ems-ipam/.env could not be read. Refusing to replace credentials."
            exit 1
          fi

          grep -q '^EMS_HTTP_PORT=8888$' "$ENV_FILE" || {
            echo "::error::Expected existing lab web port 8888. Refusing to silently change the panel port."
            exit 1
          }

      - name: Check upgrade compatibility and back up the installed database
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_dir="$HOME/ems-ipam-lab/backups/$GITHUB_SHA"
          mkdir -p "$backup_dir"
          python3 scripts/radius-upgrade-check.py --snapshot "$backup_dir/radius-before.json"
          docker exec ems-ipam-db-1 sh -c 'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$backup_dir/database-before.sql"
          test -s "$backup_dir/database-before.sql"
          echo "Private pre-upgrade database backup saved."

      - name: Stage current branch for persistent lab deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY="$HOME/ems-ipam-lab/current"
          NEXT="$HOME/ems-ipam-lab/next"
          rm -rf "$NEXT"
          mkdir -p "$NEXT"
          cp -a "$GITHUB_WORKSPACE/." "$NEXT/"
          rm -rf "$NEXT/.git"
          rm -rf "$DEPLOY"
          mv "$NEXT" "$DEPLOY"
          test -f "$DEPLOY/modules/radius/module.json"
          test -f "$DEPLOY/modules/radius-ops/module.json"

      - name: Build images before replacing running lab containers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/ems-ipam-lab/current"
          docker compose --project-name ems-ipam --env-file "$HOME/.ems-ipam-lab.env" -f compose.yml -f modules/radius-ops/compose.module.yml build app radius_ops

      - name: Replace only EMS-IPAM lab containers
        shell: bash
        run: |
          set -Eeuo pipefail
          ids="$(docker ps -aq --filter label=com.docker.compose.project=ems-ipam)"
          if [ -n "$ids" ]; then
            docker rm -f $ids
          fi
          docker network rm ems_ipam_internal >/dev/null 2>&1 || true
          echo "Existing database volume and /var/lib/ems-ipam state were preserved."

      - name: Start current EMS-IPAM lab
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/ems-ipam-lab/current"
          ENV_FILE="$HOME/.ems-ipam-lab.env"
          COMPOSE=(docker compose --project-name ems-ipam --env-file "$ENV_FILE" -f compose.yml -f modules/radius-ops/compose.module.yml)

          "${COMPOSE[@]}" up -d
          "${COMPOSE[@]}" up -d --wait --wait-timeout 180

      - name: Show lab health and safe diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd "$HOME/ems-ipam-lab/current"
          ENV_FILE="$HOME/.ems-ipam-lab.env"
          COMPOSE=(docker compose --project-name ems-ipam --env-file "$ENV_FILE" -f compose.yml -f modules/radius-ops/compose.module.yml)

          "${COMPOSE[@]}" ps
          echo "---- RADIUS health ----"
          docker inspect --format '{{json .State.Health}}' ems-ipam-radius_ops-1 2>/dev/null || true
          echo "---- RADIUS logs ----"
          "${COMPOSE[@]}" logs --no-color --tail=220 radius_ops 2>/dev/null || true
          echo "---- App logs ----"
          "${COMPOSE[@]}" logs --no-color --tail=100 app 2>/dev/null || true

      - name: Verify panel on port 8888
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8888/health >/dev/null; then
              echo "EMS-IPAM panel is healthy on http://127.0.0.1:8888"
              exit 0
            fi
            sleep 2
          done
          echo "::error::EMS-IPAM panel did not become healthy on port 8888."
          exit 1

      - name: Verify existing RADIUS data survived the upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/radius-upgrade-check.py --compare "$HOME/ems-ipam-lab/backups/$GITHUB_SHA/radius-before.json"

      - name: One-time local ali authentication probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[local-auth-probe]')
        shell: bash
        run: |
          set -Eeuo pipefail
          dbq() {
            docker exec ems-ipam-db-1 sh -lc 'psql -X -A -t -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"' sh "$1"
          }

          account_count="$(dbq "SELECT count(*) FROM radius_ops_accounts WHERE username='ali' AND enabled")"
          stored_match="$(dbq "SELECT CASE WHEN EXISTS(
            SELECT 1 FROM radcheck
            WHERE username='ali' AND attribute='Cleartext-Password' AND value=chr(49)
          ) THEN 1 ELSE 0 END")"
          policy_local="$(dbq "SELECT CASE WHEN radius_ops_identity_allowed('ali','127.0.0.1'::inet) THEN 1 ELSE 0 END")"
          resolved="$(dbq "SELECT coalesce(collection_name,'')||' -> privilege='||cisco_privilege||', mikrotik='||mikrotik_group
            FROM radius_ops_resolve_access('ali','127.0.0.1'::inet) LIMIT 1")"
          secret="$(dbq "SELECT secret FROM nas
            WHERE '127.0.0.1'::inet <<= nasname::inet
            ORDER BY masklen(nasname::inet) DESC,id LIMIT 1")"

          reply="NO_LOCAL_CLIENT"
          if [ -n "$secret" ]; then
            output="$(timeout 15 docker exec -e EMS_PROBE_SECRET="$secret" ems-ipam-radius_ops-1 sh -lc               'radtest ali 1 127.0.0.1 0 "$EMS_PROBE_SECRET"' 2>&1 || true)"
            if grep -q '^Received Access-Accept ' <<<"$output"; then
              reply="ACCESS_ACCEPT"
            elif grep -q '^Received Access-Reject ' <<<"$output"; then
              reply="ACCESS_REJECT"
            else
              reply="TIMEOUT_OR_NO_RESPONSE"
            fi
          fi

          echo "LOCAL_ALI_PROBE account_count=$account_count stored_password_is_1=$stored_match policy_127_0_0_1=$policy_local reply=$reply"
          if [ -n "$resolved" ]; then
            echo "LOCAL_ALI_POLICY $resolved"
          else
            echo "LOCAL_ALI_POLICY none"
          fi

      - name: One-time ali NAS policy map
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ali-policy-probe]')
        shell: bash
        run: |
          set -Eeuo pipefail
          dbq() {
            docker exec ems-ipam-db-1 sh -lc 'psql -X -A -F "|" -t -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"' sh "$1"
          }
          echo "ALI_ACCESS_RULES"
          dbq "SELECT a.username,col.name AS collection,g.name AS profile,g.cisco_privilege,g.mikrotik_group
               FROM radius_ops_accounts a
               JOIN radius_ops_access_rules ar ON ar.account_id=a.id AND ar.enabled
               JOIN radius_ops_collections col ON col.id=ar.collection_id
               JOIN radius_ops_groups g ON g.id=ar.profile_id
               WHERE a.username='ali'
               ORDER BY col.name"
          echo "ALI_COLLECTION_SCOPES"
          dbq "SELECT col.name,m.nas_source::text
               FROM radius_ops_accounts a
               JOIN radius_ops_access_rules ar ON ar.account_id=a.id AND ar.enabled
               JOIN radius_ops_collections col ON col.id=ar.collection_id AND col.enabled
               JOIN radius_ops_collection_members m ON m.collection_id=col.id
               WHERE a.username='ali'
               ORDER BY col.name,masklen(m.nas_source) DESC,m.nas_source::text"
          echo "REGISTERED_NAS"
          dbq "SELECT d.label,d.nas_ip::text,d.enabled,p.name AS secret_profile,
                      CASE WHEN p.enabled THEN 'profile-enabled' ELSE 'profile-disabled' END
               FROM radius_ops_devices d
               JOIN radius_ops_secret_profiles p ON p.id=d.secret_profile_id
               ORDER BY masklen(d.nas_ip) DESC,d.nas_ip::text,d.label"
      - name: Run real Docker PostgreSQL FreeRADIUS smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/ems-ipam-lab/current"
          EMS_RADIUS_SKIP_BROWSER=1 timeout 420 python3 scripts/radius-ops-docker-smoke.py

      - name: Fail if RADIUS deployment or smoke failed
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "::error::Persistent radius_ops deployment is unhealthy. The new Core/UI remains deployed for inspection."
            exit 1
          fi
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::Real RADIUS Docker smoke failed. Persistent lab remains available for diagnosis."
            exit 1
          fi
          echo "Persistent lab and real RADIUS smoke both passed."
