name: EMS-IPAM Prefix Color Toggle — Lab Deployment

on:
  push:
    branches:
      - feat/subnet-color-inheritance-toggle-20261121
    paths:
      - .github/ipam-color-toggle-deploy-trigger.txt

permissions:
  contents: read

concurrency:
  group: ems-ipam-lab-deploy
  cancel-in-progress: false

jobs:
  app-ui-only:
    runs-on: [self-hosted, Linux, X64, ems-ipam-lab]
    timeout-minutes: 25
    steps:
      - name: Checkout tested UI source into isolated runner directory
        uses: actions/checkout@v4
        with:
          path: ipam-color-toggle-source
          clean: false
      - name: UI-only app image deployment, with private backup and automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SRC="$GITHUB_WORKSPACE/ipam-color-toggle-source"
          DEPLOY="$HOME/ems-ipam-lab/current"
          ENV_FILE="$HOME/.ems-ipam-lab.env"
          BACK="$HOME/ems-ipam-lab/ipam-color-toggle-backups/$GITHUB_SHA"
          APP=ems-ipam-app-1
          DB=ems-ipam-db-1
          RADIUS=ems-ipam-radius_ops-1
          IMAGE=ems-ipam-base:1.7.2
          SAVE_TAG="ems-ipam-prefix-rollback:$GITHUB_RUN_ID"
          test -f "$SRC/docker-app/public/styles.css"
          test -f "$SRC/docker-app/public/index.html"
          test -f "$SRC/docker-app/public/app.js"
          test -f "$SRC/docker-app/server/migrations/004-prefix-color-inheritance.sql"
          test -f "$SRC/docker-app/server/main.mjs"
          cd "$SRC"
          python3 scripts/checksums.py --check
          test -f "$DEPLOY/compose.yml"
          test -f "$DEPLOY/docker-app/Dockerfile"
          test -f "$DEPLOY/modules/radius-ops/compose.module.yml"
          test -s "$ENV_FILE"
          grep -qx 'EMS_HTTP_PORT=8888' "$ENV_FILE"
          for c in "$APP" "$DB" "$RADIUS"; do
            test "$(docker inspect --format '{{.State.Running}}' "$c")" = true
          done
          OLD_DB_ID="$(docker inspect --format '{{.Id}}' "$DB")"
          OLD_RADIUS_ID="$(docker inspect --format '{{.Id}}' "$RADIUS")"
          OLD_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$APP")"
          mkdir -p "$BACK"
          echo "Saving private DB backup and RADIUS checkpoint before additive prefix preference migration."
          docker exec "$DB" sh -c 'exec pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$BACK/db-before.dump"
          test -s "$BACK/db-before.dump"
          docker exec -i "$DB" sh -c 'exec pg_restore --list' < "$BACK/db-before.dump" >/dev/null
          python3 "$DEPLOY/scripts/radius-upgrade-check.py" --snapshot "$BACK/radius-before.json"

          cp -a "$DEPLOY/docker-app/public/styles.css" "$BACK/styles.css"
          cp -a "$DEPLOY/docker-app/public/index.html" "$BACK/index.html"
          cp -a "$DEPLOY/docker-app/public/app.js" "$BACK/app.js"
          cp -a "$DEPLOY/docker-app/server/main.mjs" "$BACK/main.mjs"
          cp -a "$DEPLOY/docker-app/server/migrations.mjs" "$BACK/migrations.mjs"
          if test -f "$DEPLOY/docker-app/server/migrations/004-prefix-color-inheritance.sql"; then cp -a "$DEPLOY/docker-app/server/migrations/004-prefix-color-inheritance.sql" "$BACK/color-migration.sql"; fi
          cp -a "$DEPLOY/modules/ipam" "$BACK/ipam"
          cp -a "$DEPLOY/modules/network-access" "$BACK/network-access"
          if docker image inspect "$OLD_IMAGE_ID" >/dev/null 2>&1; then
            # Exact old image still exists, tag that image as our rollback copy.
            docker image tag "$OLD_IMAGE_ID" "$SAVE_TAG"
          else
            # The original immutable container image may have been pruned.
            # Only rebuild an old rollback image if the installed source matches
            # the actual live app's JS/static assets, before applying any patch.
            echo "Original app image digest pruned; verifying installed source against live container."
            for rel in package-lock.json public/app.js public/styles.css public/index.html server/main.mjs; do
              source_hash="$(sha256sum "$DEPLOY/docker-app/$rel" | cut -d' ' -f1)"
              installed_hash="$(docker exec "$APP" sha256sum "/app/$rel" | cut -d' ' -f1)"
              test "$source_hash" = "$installed_hash" || {
                echo "::error::Installed source and running app differ for $rel; cannot safely build rollback."
                exit 1
              }
            done
            echo "Building pre-update rollback image from verified installed source."
            docker compose --project-name ems-ipam --env-file "$ENV_FILE" \
              -f "$DEPLOY/compose.yml" -f "$DEPLOY/modules/radius-ops/compose.module.yml" \
              build app
            docker image tag "$IMAGE" "$SAVE_TAG"
          fi

          UPDATED=0
          rollback() {
            code=$?
            if test "$code" -ne 0 && test "$UPDATED" = 1; then
              echo "::warning::UI verification failed; restoring old CSS/modules/image and app container."
              cp -a "$BACK/styles.css" "$DEPLOY/docker-app/public/styles.css"
              cp -a "$BACK/index.html" "$DEPLOY/docker-app/public/index.html"
              cp -a "$BACK/app.js" "$DEPLOY/docker-app/public/app.js"
              cp -a "$BACK/main.mjs" "$DEPLOY/docker-app/server/main.mjs"
              cp -a "$BACK/migrations.mjs" "$DEPLOY/docker-app/server/migrations.mjs"
              if test -f "$BACK/color-migration.sql"; then cp -a "$BACK/color-migration.sql" "$DEPLOY/docker-app/server/migrations/004-prefix-color-inheritance.sql"; else rm -f "$DEPLOY/docker-app/server/migrations/004-prefix-color-inheritance.sql"; fi
              docker image tag "$SAVE_TAG" "$IMAGE"
              docker compose --project-name ems-ipam --env-file "$ENV_FILE" \
                -f "$DEPLOY/compose.yml" -f "$DEPLOY/modules/radius-ops/compose.module.yml" \
                up -d --no-deps --force-recreate app || true
            fi
            exit "$code"
          }
          trap rollback EXIT
          UPDATED=1

          # Copy reviewed IPAM UI and prefix API/migration only. Radio, RADIUS and NAC untouched.
          install -m 0644 "$SRC/docker-app/public/styles.css" "$DEPLOY/docker-app/public/styles.css"
          install -m 0644 "$SRC/docker-app/public/index.html" "$DEPLOY/docker-app/public/index.html"
          install -m 0644 "$SRC/docker-app/public/app.js" "$DEPLOY/docker-app/public/app.js"
          install -m 0644 "$SRC/docker-app/server/main.mjs" "$DEPLOY/docker-app/server/main.mjs"
          install -m 0644 "$SRC/docker-app/server/migrations.mjs" "$DEPLOY/docker-app/server/migrations.mjs"
          install -m 0644 "$SRC/docker-app/server/migrations/004-prefix-color-inheritance.sql" "$DEPLOY/docker-app/server/migrations/004-prefix-color-inheritance.sql"

          echo "Rebuilding only existing app image with updated static UI files."
          docker compose --project-name ems-ipam --env-file "$ENV_FILE" \
            -f "$DEPLOY/compose.yml" -f "$DEPLOY/modules/radius-ops/compose.module.yml" \
            build app
          docker compose --project-name ems-ipam --env-file "$ENV_FILE" \
            -f "$DEPLOY/compose.yml" -f "$DEPLOY/modules/radius-ops/compose.module.yml" \
            up -d --no-deps --force-recreate app

          healthy=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 5 http://127.0.0.1:8888/health > "$BACK/health.json"; then
              healthy=1; break
            fi
            sleep 2
          done
          test "$healthy" = 1 || { echo "::error::App did not become healthy"; exit 1; }
          grep -q '"ipam"' "$BACK/health.json"
          grep -q '"network-access"' "$BACK/health.json"

          docker exec "$APP" node --check /app/server/main.mjs
          docker exec "$APP" node --check /app/public/app.js
          docker exec "$APP" sh -c 'grep -q "function applySheetLiveSearch" /app/public/app.js'
          docker exec "$APP" sh -c 'grep -q "function effectiveSubnetColor" /app/public/app.js'
          docker exec "$APP" sh -c 'grep -q "prefixInheritColorToChildren" /app/public/index.html'
          docker exec "$APP" sh -c 'grep -q "inherit_color_to_children" /app/server/main.mjs'
          docker exec "$DB" sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "\\d prefixes"' | grep -q inherit_color_to_children
          test "$(curl -fsS --max-time 6 http://127.0.0.1:8888/app.js | grep -c "function applySheetLiveSearch")" -gt 0
          python3 "$DEPLOY/scripts/installed-modules-check.py"
          python3 "$DEPLOY/scripts/radius-upgrade-check.py" --compare "$BACK/radius-before.json"
          test "$(docker inspect --format '{{.Id}}' "$DB")" = "$OLD_DB_ID"
          test "$(docker inspect --format '{{.Id}}' "$RADIUS")" = "$OLD_RADIUS_ID"
          UPDATED=0
          echo "PASS LIVE_IPAM_UI_DEPLOY commit=$GITHUB_SHA port=8888; Core data, DB and RADIUS preserved"
          echo "PASS Prefix inheritable color preference on VM; additive migration, DB backed up; RADIUS unchanged"
