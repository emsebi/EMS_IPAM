services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - ems_ipam_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMS_ADMIN_USERNAME: ${EMS_ADMIN_USERNAME}
      EMS_ADMIN_PASSWORD_B64: ${EMS_ADMIN_PASSWORD_B64}
      EMS_SESSION_SECRET: ${EMS_SESSION_SECRET}
      TZ: ${TZ:-Asia/Tehran}
    ports:
      - "${EMS_HTTP_PORT:-8080}:8080"
    volumes:
      - ${EMS_STATE_DIR:-/var/lib/ems-ipam}:/state
    networks:
      - internal

networks:
  internal:
    name: ems_ipam_internal

volumes:
  ems_ipam_db_data:
    name: ems_ipam_db_data
