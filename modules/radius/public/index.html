<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMS RADIUS</title><link rel="stylesheet" href="/radius/styles.css?v=0.7.0">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="mark">RA</span><span><b>EMS RADIUS</b><small>&#1605;&#1583;&#1740;&#1585;&#1740;&#1578; &#1583;&#1587;&#1578;&#1585;&#1587;&#1740; &#1588;&#1576;&#1705;&#1607;</small></span></a>
  <nav><button class="nav active" data-view="dashboard">&#1583;&#1575;&#1588;&#1576;&#1608;&#1585;&#1583;</button><button class="nav admin" data-view="networks">RADIUS Networks</button><button class="nav admin" data-view="users">&#1705;&#1575;&#1585;&#1576;&#1585;&#1575;&#1606; &#1578;&#1580;&#1607;&#1740;&#1586;&#1575;&#1578;</button><button class="nav mac" data-view="macs">MAC Access</button><button class="nav admin" data-view="settings">&#1578;&#1606;&#1592;&#1740;&#1605;&#1575;&#1578;</button></nav>
  <a class="back" href="/">IPAM</a>
</header>
<main id="page" class="page"><div class="loading">Loading...</div></main>
<dialog id="networkDialog"><form id="networkForm"><h2>RADIUS Network</h2><input id="networkId" type="hidden"><label>Name<input id="networkName" required></label><label>CIDR<input id="networkCidr" class="ltr" required placeholder="192.168.0.0/16"></label><label>Vendor<select id="networkVendor"><option value="any">Any</option><option value="cisco">Cisco</option><option value="mikrotik">MikroTik</option></select></label><label>Shared Secret<input id="networkSecret" type="password" autocomplete="new-password"></label><label class="check"><input id="networkEnabled" type="checkbox" checked> Enabled</label><div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="radiusUserDialog"><form id="radiusUserForm"><h2>RADIUS User</h2><input id="radiusUserId" type="hidden"><label>Username<input id="radiusUsername" class="ltr" required></label><label>Display Name<input id="radiusDisplayName"></label><label>Password<input id="radiusPassword" type="password" autocomplete="new-password"></label><label>Account Type<select id="radiusAccountType"><option value="human">Human User</option><option value="system">SYSTEM ACCOUNT</option></select></label><div class="grid3"><label>MikroTik<select id="radiusMikrotik"><option value="none">None</option><option value="read">Read</option><option value="write">Write</option><option value="full">Full</option></select></label><label>Cisco Privilege<input id="radiusCisco" type="number" min="0" max="15" value="0"></label><label>Nexus Role<select id="radiusNexus"><option value="none">None</option><option value="network-operator">network-operator</option><option value="network-admin">network-admin</option></select></label></div><label>Notes<textarea id="radiusNotes"></textarea></label><label class="check"><input id="radiusUserEnabled" type="checkbox" checked> Enabled</label><div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="macDialog"><form id="macForm"><h2>MAC Client</h2><input id="macId" type="hidden"><label>MAC<input id="macAddress" class="ltr" required placeholder="AA:BB:CC:DD:EE:FF"></label><label>Name<input id="macName"></label><label>Description<textarea id="macDescription"></textarea></label><div class="grid3"><label>Device Type<select id="macType"><option>computer</option><option>laptop</option><option>phone</option><option>camera</option><option>printer</option><option>access-point</option><option>iot</option><option selected>other</option></select></label><label>Company<select id="macCompany"><option value="">All / None</option></select></label><label>Access<select id="macMode"><option value="allow">Allow / Keep Switch VLAN</option><option value="allow_vlan">Allow + Dynamic VLAN</option><option value="block">Block</option></select></label></div><label id="macVlanWrap" class="hidden">VLAN<input id="macVlan" type="number" min="1" max="4094"></label><label class="check"><input id="macEnabled" type="checkbox" checked> Enabled</label><div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="historyDialog"><div class="dialog-card"><div class="panel-head"><h2>آخرین اتصالات MAC</h2><button type="button" data-close>×</button></div><div id="historyBody"></div></div></dialog><div id="toast" class="toast"></div><script type="module" src="/radius/app.js?v=0.7.0"></script>
</body></html>
